<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ventura · Control interno</title>
<style>
  :root{
    --bg: #0A0D13;
    --bg-panel: #10141C;
    --bg-card: #141926;
    --hover: #1B2130;
    --line: #232A3B;
    --ink: #F1F3F8;
    --muted: #8A93A8;
    --muted-2: #5B6478;
    --rose: #9B8CFA;
    --rose-dim: #241F45;
    --gold: #EAB308;
    --gold-dim: rgba(234,179,8,0.15);
    --green: #22C55E;
    --green-dim: rgba(34,197,94,0.15);
    --red: #F0555A;
    --red-dim: rgba(240,85,90,0.15);
    --amber: #F0954A;
    --amber-dim: rgba(240,148,74,0.15);
    --blue: #4F8EF7;
    --blue-dim: rgba(79,142,247,0.15);
    --purple: #8B8CF5;
    --purple-dim: rgba(139,140,245,0.15);
    --amber: #B8791F;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 10px rgba(0,0,0,0.25);
    font-variant-numeric: tabular-nums;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:14px; line-height:1.45;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  #sidebar{
    width:216px; flex-shrink:0; background:var(--bg-panel);
    border-right:1px solid var(--line); padding:22px 14px; display:flex; flex-direction:column;
  }
  .brand{display:flex; align-items:baseline; gap:6px; padding:0 8px 22px;}
  .brand .mark{color:var(--rose); font-size:20px; font-weight:700; letter-spacing:-0.02em;}
  .brand .sub{color:var(--muted-2); font-size:11px;}
  nav{display:flex; flex-direction:column; gap:2px;}
  nav button{
    all:unset; cursor:pointer; padding:10px 12px; border-radius:var(--radius);
    color:var(--muted); font-size:13.5px; display:flex; align-items:center; gap:10px;
  }
  nav button:hover{background:var(--hover); color:var(--ink);}
  nav button.active{background:var(--rose-dim); color:var(--ink); font-weight:600;}
  nav button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0.55;flex-shrink:0;}
  .sidebar-foot{margin-top:auto; padding:10px 8px 0; color:var(--muted-2); font-size:11px; border-top:1px solid var(--line);}

  /* Main */
  #main{flex:1; min-width:0; padding:26px 34px 60px;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; gap:16px; flex-wrap:wrap;}
  .page-head h1{margin:0; font-size:20px; font-weight:700;}
  .page-head p{margin:4px 0 0; color:var(--muted); font-size:13px;}

  .btn{
    all:unset; cursor:pointer; padding:9px 16px; border-radius:var(--radius);
    font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--rose); color:#FFF7F9;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:var(--bg-card); color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--muted-2);}
  .btn-danger{background:transparent; color:var(--red); padding:6px 10px;}
  .btn-sm{padding:6px 10px; font-size:12px;}

  /* KPI cards */
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:22px;}
  .kpi{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
  .kpi .label{color:var(--muted); font-size:12px; margin-bottom:8px;}
  .kpi .value{font-size:22px; font-weight:700;}
  .kpi .value.pos{color:var(--green);}
  .kpi .value.neg{color:var(--red);}
  .kpi .sub{color:var(--muted-2); font-size:11.5px; margin-top:4px;}

  .panel{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:18px; box-shadow:var(--shadow);}
  .panel h2{margin:0 0 4px; font-size:14px; font-weight:700;}
  .panel .hint{color:var(--muted); font-size:12px; margin-bottom:14px;}

  .section-label{color:var(--muted-2); font-size:11px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; margin:28px 0 12px;}
  .filter-bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:22px;}
  .pill-toggle{display:flex; gap:4px; background:var(--bg-card); padding:4px; border-radius:999px; border:1px solid var(--line);}
  .pill-toggle button{all:unset; cursor:pointer; padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--muted);}
  .pill-toggle button.active{background:var(--gold); color:#1A1400;}
  .filter-bar input, .filter-bar select{width:auto; min-width:130px;}

  .kpi-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:12px;}
  .kpi-icon.c-purple{background:var(--purple-dim); color:var(--purple);}
  .kpi-icon.c-blue{background:var(--blue-dim); color:var(--blue);}
  .kpi-icon.c-green{background:var(--green-dim); color:var(--green);}
  .kpi-icon.c-gold{background:var(--gold-dim); color:var(--gold);}
  .kpi-icon.c-amber{background:var(--amber-dim); color:var(--amber);}
  .kpi-icon.c-red{background:var(--red-dim); color:var(--red);}

  .metric-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .metric-box{background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:12px;}
  .metric-box .mlabel{font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;}
  .metric-box .mvalue{font-size:19px; font-weight:700;}
  .metric-box .mvalue.pos{color:var(--green);}
  .metric-box .mvalue.neg{color:var(--red);}

  .legend-row{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--muted);}
  .legend-row .ldot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px;}
  .chart-tooltip{
    display:none; position:absolute; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:7px; padding:7px 11px; font-size:11.5px; z-index:5; white-space:nowrap; pointer-events:none;
    box-shadow:var(--shadow);
  }

  .funnel-row{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .funnel-label{width:150px; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .funnel-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .funnel-bar-wrap{flex:1; background:var(--bg-panel); border-radius:6px; overflow:hidden; height:32px;}
  .funnel-bar{height:100%; min-width:2px; transition:width .3s;}
  .funnel-value{width:44px; text-align:right; font-weight:700; flex-shrink:0;}

  .stat-box{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
  .stat-box .stlabel{color:var(--muted-2); font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .stat-box .stvalue{font-size:21px; font-weight:700;}
  .stat-box .stnote{color:var(--muted); font-size:11.5px; margin-top:4px;}
  .stat-box .stnote.warn{color:var(--red);}

  /* Forms */
  .form-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; margin-bottom:12px;}
  label{display:block; color:var(--muted); font-size:11.5px; margin-bottom:4px;}
  input, select{
    width:100%; background:var(--bg-panel); border:1px solid var(--line); color:var(--ink);
    border-radius:7px; padding:8px 9px; font-size:13px; font-family:inherit;
  }
  input:focus, select:focus{outline:none; border-color:var(--rose);}
  .field{min-width:0;}

  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:12.8px;}
  thead th{
    text-align:left; color:var(--muted); font-weight:600; font-size:11px;
    padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  tbody td{padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody tr:hover{background:var(--hover);}
  .table-wrap{overflow-x:auto;}
  .empty{padding:34px 10px; text-align:center; color:var(--muted-2);}

  .pill{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; display:inline-block;}
  select.sel-estado{min-width:132px;}
  select.sel-producto{min-width:180px;}
  .pill.entregado{background:rgba(47,158,110,0.13); color:var(--green);}
  .pill.transito{background:rgba(62,126,166,0.14); color:var(--blue);}
  .pill.confirmado{background:rgba(184,122,33,0.14); color:var(--gold);}
  .pill.pendiente{background:rgba(140,107,120,0.12); color:var(--muted);}
  .pill.devuelto, .pill.cancelado{background:rgba(204,70,70,0.13); color:var(--red);}

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end;}
  .filters .field{width:150px;}

  .tabs{display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--line);}
  .tabs button{
    all:unset; cursor:pointer; padding:9px 4px; margin-right:18px; color:var(--muted);
    font-size:13px; font-weight:600; border-bottom:2px solid transparent;
  }
  .tabs button.active{color:var(--ink); border-color:var(--rose);}

  .row-actions{display:flex; gap:4px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:900px){ .two-col{grid-template-columns:1fr;} }

  .note{font-size:12px; color:var(--muted-2); margin-top:8px;}
  .status-msg{font-size:12px; padding:8px 12px; border-radius:7px; margin-bottom:12px;}
  .status-msg.ok{background:rgba(47,158,110,0.1); color:var(--green);}
  .status-msg.err{background:rgba(204,70,70,0.1); color:var(--red);}

  .slider-row{display:flex; align-items:center; gap:10px;}
  input[type=range]{accent-color:var(--rose);}
  .bar{height:8px; border-radius:4px; background:var(--bg-panel); overflow:hidden; margin:8px 0;}
  .bar-fill{height:100%; background:var(--rose);}

  /* KPI cards con icono (estilo Rocket) */
  .kpi-v2{background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:var(--shadow);}
  .kpi-v2 .chip{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:12px;}
  .kpi-v2 .chip.c-purple{background:var(--purple-dim); color:var(--purple);}
  .kpi-v2 .chip.c-blue{background:var(--blue-dim); color:var(--blue);}
  .kpi-v2 .chip.c-green{background:var(--green-dim); color:var(--green);}
  .kpi-v2 .chip.c-gold{background:var(--gold-dim); color:var(--gold);}
  .kpi-v2 .chip.c-amber{background:var(--amber-dim); color:var(--amber);}
  .kpi-v2 .chip.c-red{background:var(--red-dim); color:var(--red);}
  .kpi-v2 .lbl{color:var(--muted); font-size:12.5px; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .kpi-v2 .val{font-size:24px; font-weight:700;}
  .kpi-v2 .sub{color:var(--muted-2); font-size:11.5px; margin-top:5px;}

  .section-label{color:var(--muted); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; margin:26px 0 12px;}

  /* Funnel */
  .funnel-row{margin-bottom:16px;}
  .funnel-row .flabel{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .funnel-track{height:34px; border-radius:8px; background:var(--bg-panel); overflow:hidden;}
  .funnel-fill{height:100%; border-radius:8px; display:flex; align-items:center;}
  .funnel-drop{color:var(--muted-2); font-size:11.5px; margin:4px 0 0 2px;}

  /* Mini line chart */
  .chart-legend{display:flex; gap:16px; margin-top:10px; flex-wrap:wrap;}
  .chart-legend span{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);}
  .chart-legend .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .metrics-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .metric-box{padding:2px 0;}
  .metric-box .mlabel{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.03em;}
  .metric-box .mvalue{font-size:20px; font-weight:700; margin-top:4px;}
  .metric-box .mvalue.green{color:var(--green);}
  .metric-box .mvalue.red{color:var(--red);}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand"><span class="mark">Ventura</span><span class="sub">control</span></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">Datos compartidos del equipo<br><a href="#" id="change_url" style="color:var(--muted-2)">Cambiar conexión de datos</a></div>
  </div>
  <div id="main"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------- datos: provincias y cantones de Ecuador ---------- */
const PROVINCIAS_ECUADOR = {
  "Azuay": ["Camilo Ponce Enríquez","Chordeleg","Cuenca","El Pan","Girón","Guachapala","Gualaceo","Nabón","Oña","Paute","Pucará","San Fernando","Santa Isabel","Sevilla de Oro","Sígsig"],
  "Bolívar": ["Caluma","Chillanes","Chimbo","Echeandía","Guaranda","Las Naves","San Miguel"],
  "Cañar": ["Azogues","Biblián","Cañar","Déleg","El Tambo","La Troncal","Suscal"],
  "Carchi": ["Bolívar","Espejo","Mira","Montúfar","San Pedro de Huaca","Tulcán"],
  "Chimborazo": ["Alausí","Chambo","Chunchi","Colta","Cumandá","Guamote","Guano","Pallatanga","Penipe","Riobamba"],
  "Cotopaxi": ["La Maná","Latacunga","Pangua","Pujilí","Salcedo","Saquisilí","Sigchos"],
  "El Oro": ["Arenillas","Atahualpa","Balsas","Chilla","El Guabo","Huaquillas","Las Lajas","Machala","Marcabelí","Pasaje","Piñas","Portovelo","Santa Rosa","Zaruma"],
  "Esmeraldas": ["Atacames","Eloy Alfaro","Esmeraldas","Muisne","Quinindé","Río Verde","San Lorenzo"],
  "Galápagos": ["Isabela","San Cristóbal","Santa Cruz"],
  "Guayas": ["Alfredo Baquerizo Moreno","Balao","Balzar","Colimes","Coronel Marcelino Maridueña","Daule","Durán","El Empalme","El Triunfo","General Antonio Elizalde","Guayaquil","Isidro Ayora","Lomas de Sargentillo","Milagro","Naranjal","Naranjito","Nobol","Palestina","Pedro Carbo","Playas","Salitre","Samborondón","Santa Lucía","Simón Bolívar","Yaguachi"],
  "Imbabura": ["Antonio Ante","Cotacachi","Ibarra","Otavalo","Pimampiro","San Miguel de Urcuquí"],
  "Loja": ["Calvas","Catamayo","Celica","Chaguarpamba","Espíndola","Gonzanamá","Loja","Macará","Olmedo","Paltas","Pindal","Puyango","Quilanga","Saraguro","Sozoranga","Zapotillo"],
  "Los Ríos": ["Baba","Babahoyo","Buena Fe","Mocache","Montalvo","Palenque","Pueblo Viejo","Quevedo","Quinsaloma","Urdaneta","Valencia","Ventanas","Vinces"],
  "Manabí": ["Bolívar","Chone","El Carmen","Flavio Alfaro","Jama","Jaramijó","Jipijapa","Junín","Manta","Montecristi","Olmedo","Paján","Pedernales","Pichincha","Portoviejo","Puerto López","Rocafuerte","San Vicente","Santa Ana","Sucre","Tosagua","Veinticuatro de Mayo"],
  "Morona Santiago": ["Gualaquiza","Huamboya","Limón Indanza","Logroño","Morona","Pablo Sexto","Palora","San Juan Bosco","Santiago de Méndez","Sevilla Don Bosco","Sucúa","Taisha","Tiwintza"],
  "Napo": ["Archidona","Carlos Julio Arosemena Tola","El Chaco","Quijos","Tena"],
  "Orellana": ["Aguarico","Francisco de Orellana","Joya de los Sachas","Loreto"],
  "Pastaza": ["Arajuno","Mera","Pastaza","Santa Clara"],
  "Pichincha": ["Cayambe","Mejía","Pedro Moncayo","Pedro Vicente Maldonado","Puerto Quito","Quito","Rumiñahui","San Miguel de Los Bancos"],
  "Santa Elena": ["La Libertad","Salinas","Santa Elena"],
  "Santo Domingo de los Tsáchilas": ["La Concordia","Santo Domingo de los Colorados"],
  "Sucumbíos": ["Cascales","Cuyabeno","Gonzalo Pizarro","Lago Agrio","Putumayo","Shushufindi","Sucumbíos"],
  "Tungurahua": ["Ambato","Baños","Cevallos","Mocha","Patate","Pelileo","Píllaro","Quero","Tisaleo"],
  "Zamora Chinchipe": ["Centinela del Cóndor","Chinchipe","El Pangui","Nangaritza","Palanda","Paquisha","Yacuambi","Yantzaza","Zamora"]
};
const TRANSPORTADORAS = ["Servientrega","Laar Courier","Gintracom"];

/* ---------- normalización de ciudad / teléfono / fecha para importaciones ---------- */
const CIUDAD_ALIASES = {
  'nueva loja':'Lago Agrio', 'puyo':'Pastaza', 'bahia de caraquez':'Sucre',
  'cariamanga':'Calvas', 'sangolqui':'Rumiñahui', 'orellana':'Francisco de Orellana',
  'santo domingo':'Santo Domingo de los Colorados', 'el coca':'Francisco de Orellana',
  'las ventanas':'Ventanas', 'pangui':'El Pangui'
};
function stripAccents(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function normStr(s){ return stripAccents(s).toLowerCase().trim().replace(/\s+/g,' '); }
let _cityIndex = null;
function buildCityIndex(){
  _cityIndex = {};
  Object.keys(PROVINCIAS_ECUADOR).forEach(prov=>{
    PROVINCIAS_ECUADOR[prov].forEach(city=>{
      _cityIndex[normStr(city)] = {provincia:prov, ciudad:city};
    });
  });
}
function findProvinciaCiudad(rawCiudad){
  if(!_cityIndex) buildCityIndex();
  if(!rawCiudad) return {provincia:'', ciudad:''};
  const n = normStr(rawCiudad);
  if(_cityIndex[n]) return _cityIndex[n];
  const aliasTarget = CIUDAD_ALIASES[n];
  if(aliasTarget){
    const n2 = normStr(aliasTarget);
    if(_cityIndex[n2]) return _cityIndex[n2];
  }
  return {provincia:'', ciudad: String(rawCiudad).trim()};
}
function normalizePhoneRaw(raw){
  if(raw===undefined || raw===null) return '';
  let d = String(raw).replace(/\.0$/,'').replace(/[^0-9]/g,'');
  if(!d) return '';
  if(d.length===9) d = '0'+d;
  return d;
}
function excelSerialToDate(n){
  const utcDays = Math.floor(n - 25569);
  const utcValue = utcDays*86400;
  const d = new Date(utcValue*1000);
  return d;
}
function parseAnyDate(val){
  if(val===undefined || val===null || val==='') return '';
  if(val instanceof Date && !isNaN(val)) return val.toISOString().slice(0,10);
  if(typeof val === 'number'){ const d = excelSerialToDate(val); if(!isNaN(d)) return d.toISOString().slice(0,10); return ''; }
  const s = String(val).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d = new Date(s);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return '';
}

/* ---------- storage helpers (Google Sheets vía Apps Script) ---------- */
const KEYS = { pedidos:'ventura:pedidos', compras:'ventura:compras', egresos:'ventura:egresos', config:'ventura:config', productos:'ventura:productos', envios:'ventura:envios' };
const API_URL_KEY = 'venturaApiUrl';
function getApiUrl(){ return localStorage.getItem(API_URL_KEY) || ''; }
function setApiUrl(u){ localStorage.setItem(API_URL_KEY, u.trim()); }

async function loadRaw(key, fallback){
  try{
    const url = getApiUrl();
    if(!url) return fallback;
    const res = await fetch(url + '?key=' + encodeURIComponent(key));
    const text = await res.text();
    if(!text) return fallback;
    const data = JSON.parse(text);
    return (data===null || data===undefined) ? fallback : data;
  }catch(e){ return fallback; }
}
async function saveRaw(key, value){
  try{
    const url = getApiUrl();
    if(!url) return false;
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ key, value: JSON.stringify(value) })
    });
    const data = await res.json();
    return !!data.ok;
  }catch(e){ return false; }
}
async function loadList(key){ const r = await loadRaw(key, []); return Array.isArray(r) ? r : []; }
async function saveList(key, arr){ return saveRaw(key, arr); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-EC', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function pct(n){ return (Number(n)||0).toFixed(1) + '%'; }
function parseNum(v){ return Number(String(v).replace(/[^0-9.\-]/g,'')) || 0; }

/* ---------- state ---------- */

const ESTADOS = ['Pendiente','Confirmado','En tránsito','Entregado','Devuelto','Cancelado'];
function estadoClass(e){
  const m = {'Entregado':'entregado','En tránsito':'transito','Confirmado':'confirmado','Pendiente':'pendiente','Devuelto':'devuelto','Cancelado':'cancelado'};
  return m[e] || 'pendiente';
}
function formatPhoneEC(raw){
  let d = String(raw||'').replace(/[^0-9]/g,'');
  if(!d) return '';
  if(d.startsWith('0')) d = d.slice(1);
  if(!d.startsWith('593')) d = '593' + d;
  return d;
}
function buildMensaje(template, p){
  return template
    .replace(/{cliente}/g, p.cliente || 'cliente')
    .replace(/{producto}/g, p.producto || 'tu producto')
    .replace(/{transportadora}/g, p.transportadora || 'la transportadora')
    .replace(/{guia}/g, p.guia || 'sin número');
}

/* ---------- boot ---------- */
async function boot(){
  if(!getApiUrl()){ renderSetup(); return; }
  const [p,c,e,cfg,prod,env] = await Promise.all([
    loadList(KEYS.pedidos), loadList(KEYS.compras), loadList(KEYS.egresos),
    loadRaw(KEYS.config, {mensajeTemplate: DEFAULT_TEMPLATE}), loadList(KEYS.productos), loadList(KEYS.envios)
  ]);
  STATE.pedidos = p; STATE.compras = c; STATE.egresos = e; STATE.productos = prod; STATE.envios = env;
  STATE.config = (cfg && cfg.mensajeTemplate) ? cfg : {mensajeTemplate: DEFAULT_TEMPLATE};
  STATE.loaded = true;
  renderNav(); renderMain();
}

function renderSetup(){
  document.getElementById('sidebar').style.display = 'none';
  const main = document.getElementById('main');
  main.style.maxWidth = '520px'; main.style.margin = '60px auto';
  main.innerHTML = `
    <div class="panel">
      <h2>Conectar los datos compartidos</h2>
      <p class="hint">Pega aquí la URL de tu aplicación web de Google Apps Script (termina en /exec). Solo se hace una vez en esta computadora.</p>
      <input id="setup_url" type="text" placeholder="https://script.google.com/macros/s/..../exec">
      <div style="margin-top:12px">
        <button class="btn btn-primary" id="setup_save">Conectar</button>
        <span id="setup_status" style="margin-left:10px; font-size:12px;"></span>
      </div>
    </div>`;
  document.getElementById('setup_save').onclick = async ()=>{
    const val = document.getElementById('setup_url').value;

    document.getElementById('main').style.maxWidth=''; document.getElementById('main').style.margin='';

/* ================= DASHBOARD ================= */
function computeMetrics(pedidos, compras, egresos){
  const total = pedidos.length;
  const confirmados = pedidos.filter(p=>['Confirmado','En tránsito','Entregado'].includes(p.estado)).length;
  const despachados = pedidos.filter(p=>['En tránsito','Entregado'].includes(p.estado)).length;
  const entregados = pedidos.filter(p=>p.estado==='Entregado');
  const enTransito = pedidos.filter(p=>p.estado==='En tránsito');
  const devueltos = pedidos.filter(p=>p.estado==='Devuelto').length;
  const cancelados = pedidos.filter(p=>p.estado==='Cancelado').length;
  const novedad = pedidos.filter(p=>['Devuelto','Cancelado'].includes(p.estado));
  const noConfirmados = total - confirmados;

  const facturacionTotal = pedidos.reduce((s,p)=>s+parseNum(p.precioVenta),0);
  const facturacionEntregada = entregados.reduce((s,p)=>s+parseNum(p.precioVenta),0);
  const facturacionTransito = enTransito.reduce((s,p)=>s+parseNum(p.precioVenta),0);
  const facturacionNovedad = novedad.reduce((s,p)=>s+parseNum(p.precioVenta),0);

  const costoProductoEntregado = entregados.reduce((s,p)=>s+parseNum(p.costoProducto),0);
  const costoEnvioEntregado = entregados.reduce((s,p)=>s+parseNum(p.costoEnvio),0);
  const utilidadTransito = enTransito.reduce((s,p)=>s+(parseNum(p.precioVenta)-parseNum(p.costoProducto)-parseNum(p.costoEnvio)),0);

  const gastoAds = egresos.filter(e=>e.tipo==='Campaña').reduce((s,e)=>s+parseNum(e.monto),0);
  const gastoOtros = egresos.filter(e=>e.tipo==='Otro').reduce((s,e)=>s+parseNum(e.monto),0);
  const gastoCompras = compras.reduce((s,c)=>s+parseNum(c.total),0);

  const utilidadNeta = facturacionEntregada - costoProductoEntregado - costoEnvioEntregado - gastoAds - gastoOtros;
  const pctConfirmacion = total ? (confirmados/total*100) : 0;
  const pctEntrega = confirmados ? (entregados.length/confirmados*100) : 0;
  const ticketMedio = total ? (facturacionTotal/total) : 0;
  const conversionTotal = total ? (entregados.length/total*100) : 0;
  const perdidaConfirmacion = total ? (noConfirmados/total*100) : 0;

  return { total, confirmados, despachados, entregadosN:entregados.length, devueltos, cancelados, noConfirmados,
    facturacionTotal, facturacionEntregada, facturacionTransito, facturacionNovedad,
    costoProductoEntregado, costoEnvioEntregado, utilidadTransito, gastoAds, gastoOtros, gastoCompras,
    utilidadNeta, pctConfirmacion, pctEntrega, ticketMedio, conversionTotal, perdidaConfirmacion };
}

/* ---------- gráfica de líneas simple en SVG ---------- */
function dateRangeArray(desde, hasta){
  const out = [];
  let d = new Date(desde+'T00:00:00');
  const end = new Date(hasta+'T00:00:00');
  if(isNaN(d) || isNaN(end) || d>end) return out;
  while(d<=end){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return out;
}
let pendingCharts = [];
function lineChartSVG(dates, series, opts){
  opts = opts || {};
  const w = opts.width || 640, h = opts.height || 190, pad = 30;
  const maxY = Math.max(1, ...series.flatMap(s=>s.data));
  const stepX = dates.length>1 ? (w-pad*2)/(dates.length-1) : 0;
  const xFor = i => pad + i*stepX;
  const yFor = v => h - pad - (v/maxY)*(h-pad*2);
  const pointsFor = (data)=> data.map((v,i)=> xFor(i).toFixed(1)+','+yFor(v).toFixed(1)).join(' ');
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="overflow:visible" class="chart-svg">`;
  for(let i=0;i<=3;i++){
    const y = pad + i*((h-pad*2)/3);
    svg += `<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w-pad}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  }
  series.forEach(s=>{
    svg += `<polyline points="${pointsFor(s.data)}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  if(dates.length){
    const nLabels = Math.min(6, dates.length);
    const labelStep = Math.max(1, Math.round((dates.length-1)/((nLabels-1)||1)));
    for(let i=0;i<dates.length;i+=labelStep){
      const label = dates[i].slice(5).split('-').reverse().join('/');
      svg += `<text x="${xFor(i).toFixed(1)}" y="${h-6}" font-size="9" fill="var(--muted-2)" text-anchor="middle">${label}</text>`;
    }
  }
  svg += `<line class="hover-line" x1="0" y1="${pad}" x2="0" y2="${h-pad}" stroke="var(--muted-2)" stroke-width="1" style="display:none"/>`;
  series.forEach((s,si)=>{
    svg += `<circle class="hover-dot" data-si="${si}" r="3.5" fill="${s.color}" style="display:none"/>`;
  });
  svg += `<rect class="chart-overlay" x="${pad}" y="0" width="${Math.max(1,w-pad*2)}" height="${h}" fill="transparent" style="cursor:crosshair"/>`;
  svg += '</svg>';
  const ttId = 'tt_'+Math.random().toString(36).slice(2,9);
  pendingCharts.push({ttId, dates, series, w, h, pad, stepX, maxY});
  return `<div class="chart-wrap" style="position:relative">${svg}<div class="chart-tooltip" id="${ttId}"></div></div>`;
}
function wireCharts(){
  pendingCharts.forEach(cfg=>{
    const tooltip = document.getElementById(cfg.ttId);
    if(!tooltip) return;
    const wrap = tooltip.parentElement;
    const svg = wrap.querySelector('svg.chart-svg');
    const overlay = svg.querySelector('.chart-overlay');
    const hoverLine = svg.querySelector('.hover-line');
    const dots = svg.querySelectorAll('.hover-dot');
    const showAt = (clientX)=>{
      const rect = svg.getBoundingClientRect();
      if(rect.width===0) return;
      const scaleX = cfg.w / rect.width;
      const mx = (clientX - rect.left) * scaleX;
      let idx = cfg.stepX ? Math.round((mx - cfg.pad) / cfg.stepX) : 0;
      idx = Math.max(0, Math.min(cfg.dates.length-1, idx));
      const x = cfg.pad + idx*cfg.stepX;
      hoverLine.setAttribute('x1', x); hoverLine.setAttribute('x2', x); hoverLine.style.display='';
      let html = `<div style="font-weight:700; margin-bottom:4px">${cfg.dates[idx]}</div>`;
      cfg.series.forEach((s,si)=>{
        const val = s.data[idx];
        const y = cfg.h - cfg.pad - (val/cfg.maxY)*(cfg.h-cfg.pad*2);
        if(dots[si]){ dots[si].setAttribute('cx', x); dots[si].setAttribute('cy', y.toFixed(1)); dots[si].style.display=''; }
        html += `<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:5px"></span>${s.name||''} ${s.isMoney? money(val) : val}</div>`;
      });
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
      const wrapRect = wrap.getBoundingClientRect();
      const leftPx = (x/cfg.w)*wrapRect.width;
      tooltip.style.left = Math.max(0, Math.min(leftPx+10, wrapRect.width-150)) + 'px';
      tooltip.style.top = '2px';
    };
    overlay.addEventListener('mousemove', (ev)=>showAt(ev.clientX));
    overlay.addEventListener('touchmove', (ev)=>{ if(ev.touches[0]) showAt(ev.touches[0].clientX); }, {passive:true});
    overlay.addEventListener('mouseleave', ()=>{
      tooltip.style.display='none'; hoverLine.style.display='none';
      dots.forEach(d=>d.style.display='none');
    });
  });
}
function bucketByDate(pedidos, dates, matchFn){
  const map = {}; dates.forEach(d=>map[d]=0);
  pedidos.forEach(p=>{ if(p.fecha && map.hasOwnProperty(p.fecha) && matchFn(p)) map[p.fecha]++; });
  return dates.map(d=>map[d]);
}
function bucketSumByDate(pedidos, dates, matchFn, field){
  const map = {}; dates.forEach(d=>map[d]=0);
  pedidos.forEach(p=>{ if(p.fecha && map.hasOwnProperty(p.fecha) && matchFn(p)) map[p.fecha]+=parseNum(p[field]); });
  return dates.map(d=>map[d]);
}

  const hoy = new Date();

  const d = new Date(hoy); d.setDate(d.getDate()-Number(dashState.rango));
  dashState.desde = d.toISOString().slice(0,10);
}

/* ================= ESTADÍSTICAS ================= */
let estadState = { desde:'', hasta:'', estado:'', transportadora:'', tab:'resumen' };
function ensureEstadRango(){
  if(estadState.desde && estadState.hasta) return;
  const hoy = new Date();
  estadState.hasta = hoy.toISOString().slice(0,10);
  const d = new Date(hoy); d.setDate(d.getDate()-30);
  estadState.desde = d.toISOString().slice(0,10);
}
function donutSVG(pctVal, color, sub){
  const r=40, c=2*Math.PI*r;
  const p = Math.max(0, Math.min(100, pctVal||0));
  const dash = (p/100)*c;
  return `<svg width="104" height="104" viewBox="0 0 104 104">
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 52 52)"/>
    <text x="52" y="57" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${p.toFixed(1)}%</text>
  </svg>`;
}

function renderEstadisticas(){
  ensureEstadRango();
  const main = document.getElementById('main');
  main.appendChild(head('Estadísticas', 'Cómo se comportan tus pedidos, productos, confirmaciones y transportadoras.'));

  const filterBar = document.createElement('div'); filterBar.className='filter-bar';
  filterBar.innerHTML = `
    <input type="date" id="es_desde" value="${estadState.desde}">
    <span style="color:var(--muted)">→</span>
    <input type="date" id="es_hasta" value="${estadState.hasta}">
    <select id="es_estado"><option value="">Todos los estados</option>${ESTADOS.map(e=>`<option ${estadState.estado===e?'selected':''}>${e}</option>`).join('')}</select>
    <select id="es_trans"><option value="">Todas las transportadoras</option>${TRANSPORTADORAS.map(t=>`<option ${estadState.transportadora===t?'selected':''}>${t}</option>`).join('')}</select>
    <button class="btn btn-ghost btn-sm" id="es_buscar">Filtrar</button>
  `;
  main.appendChild(filterBar);
  setTimeout(()=>{
    document.getElementById('es_buscar').onclick = ()=>{
      estadState.desde = document.getElementById('es_desde').value || estadState.desde;
      estadState.hasta = document.getElementById('es_hasta').value || estadState.hasta;
      estadState.estado = document.getElementById('es_estado').value;
      estadState.transportadora = document.getElementById('es_trans').value;
      renderMain();
    };
  },0);

  let pedidos = STATE.pedidos.filter(p=> !p.fecha || (p.fecha>=estadState.desde && p.fecha<=estadState.hasta));
  if(estadState.estado) pedidos = pedidos.filter(p=>p.estado===estadState.estado);
  if(estadState.transportadora) pedidos = pedidos.filter(p=>p.transportadora===estadState.transportadora);
  const m = computeMetrics(pedidos, STATE.compras, STATE.egresos);
  const hoyStr = new Date().toISOString().slice(0,10);
  const pedidosHoy = STATE.pedidos.filter(p=>p.fecha===hoyStr);
  const facturadoHoy = pedidosHoy.reduce((s,p)=>s+parseNum(p.precioVenta),0);
  const noEntregados = pedidos.filter(p=>['Pendiente','Confirmado','En tránsito'].includes(p.estado)).length;

  // Tabs
  const tabs = document.createElement('div'); tabs.className='tabs';
  [['resumen','Resumen'],['productos','Productos'],['confirmaciones','Confirmaciones'],['transportadoras','Transportadoras']].forEach(([id,label])=>{
    const b = document.createElement('button'); b.textContent=label; b.className = estadState.tab===id?'active':'';
    b.onclick=()=>{ estadState.tab=id; renderMain(); };
    tabs.appendChild(b);
  });
  main.appendChild(tabs);

  if(estadState.tab==='resumen') renderEstadResumen(main, pedidos, m, pedidosHoy, facturadoHoy, noEntregados);
  else if(estadState.tab==='productos') renderEstadProductos(main, pedidos);
  else if(estadState.tab==='confirmaciones') renderEstadConfirmaciones(main, m);
  else if(estadState.tab==='transportadoras') renderEstadTransportadoras(main, pedidos);
}

function renderEstadProductos(main, pedidos){

    let rows='';
    nombres.map(nombre=>{
      const ped = pedidos.filter(p=>p.producto===nombre);
      const entregados = ped.filter(p=>p.estado==='Entregado');
      const vendidos = ped.reduce((s,p)=>s+parseNum(p.cantidad),0);
      const facturacion = ped.reduce((s,p)=>s+parseNum(p.precioVenta),0);
      const ganancia = entregados.reduce((s,p)=>s+(parseNum(p.precioVenta)-parseNum(p.costoProducto)-parseNum(p.costoEnvio)),0);
      return {nombre, vendidos, facturacion, entregadosN:entregados.length, ganancia};
    }).sort((a,b)=>b.facturacion-a.facturacion).forEach(r=>{
      rows += `<tr><td>${r.nombre}</td><td>${r.vendidos}</td><td>${r.entregadosN}</td><td>${money(r.facturacion)}</td>
        <td style="color:${r.ganancia>=0?'var(--green)':'var(--red)'}">${money(r.ganancia)}</td></tr>`;

    wrap.innerHTML = `<table><thead><tr><th>Producto</th><th>Unidades pedidas</th><th>Entregados</th><th>Facturación</th><th>Ganancia estimada</th></tr></thead><tbody>${rows}</tbody></table>`;

  panel.appendChild(wrap);

}

function normCliente(s){ return normStr(s); }
function mapEstadoDropiExport(raw){
  const s = normStr(String(raw||'').replace(/_/g,' '));
  if(s.includes('entregad')) return 'Entregado';
  if(s.includes('devolu')) return 'Devuelto';
  if(s.includes('cancel') || s.includes('rechaz')) return 'Cancelado';
  if(s.includes('pendient')) return 'Pendiente';
  if(s.includes('confirmad')) return 'Confirmado';
  return 'En tránsito';
}
function mapTransportadoraDropi(raw){
  const key = normStr(raw).replace(/\s+/g,'');
  const map = {'servientrega':'Servientrega','laarcourier':'Laar Courier','gintracom':'Gintracom'};
  return map[key] || String(raw||'').trim();
}
function titleCase(s){ return String(s||'').toLowerCase().replace(/(^|\s|\+)\S/g, c=>c.toUpperCase()); }
function mapProductoDropi(rawProducto, cantidad){
  const s = normStr(rawProducto);
  if(s.includes('corrector') && s.includes('postura')){
    return Number(cantidad)>=2 ? 'Corrector de Postura 2 unidades' : 'Corrector de Postura 1 unidad';
  }
  let catalogo = STATE.productos.find(p=>normStr(p.nombre)===s);
  if(!catalogo) catalogo = STATE.productos.find(p=>{ const n=normStr(p.nombre); return n && (s.includes(n) || n.includes(s)); });
  return catalogo ? catalogo.nombre : titleCase(rawProducto);
}

async function processDropiSync(rows){
  const headerRow = (rows[0]||[]).map(h=>String(h||'').trim());
  const idx = (name)=>headerRow.indexOf(name);
  const iFecha=idx('FECHA'), iCliente=idx('NOMBRE CLIENTE'), iEstado=idx('ESTATUS'),
    iTrans=idx('TRANSPORTADORA'), iCiudad=idx('CIUDAD DESTINO'), iProd=idx('PRODUCTO'),
    iCant=idx('CANTIDAD'), iTotal=idx('TOTAL DE LA ORDEN'), iCostoProv=idx('PRECIO PROVEEDOR X CANTIDAD'),
    iFlete=idx('PRECIO FLETE');
  if(iCliente<0 || iEstado<0 || iTotal<0) return { error:true };

  const seenKeys = new Set();
  let fechas = [];
  let actualizados = 0, nuevos = 0;

  for(let r=1;r<rows.length;r++){
    const row = rows[r]; if(!row) continue;
    const clienteRaw = String(row[iCliente]||'').trim();
    if(!clienteRaw) continue;
    const fecha = iFecha>-1 ? parseAnyDate(row[iFecha]) : '';
    if(fecha) fechas.push(fecha);
    const key = normCliente(clienteRaw)+'|'+fecha;
    seenKeys.add(key);

    const cantidad = iCant>-1 ? (parseNum(row[iCant])||1) : 1;
    const {provincia, ciudad} = findProvinciaCiudad(iCiudad>-1 ? row[iCiudad] : '');
    const producto = iProd>-1 ? mapProductoDropi(row[iProd], cantidad) : '';
    const estado = mapEstadoDropiExport(iEstado>-1 ? row[iEstado] : '');
    const transportadora = iTrans>-1 ? mapTransportadoraDropi(row[iTrans]) : '';
    const precioVenta = iTotal>-1 ? parseNum(row[iTotal]) : '';
    const costoProducto = iCostoProv>-1 ? parseNum(row[iCostoProv]) : '';
    const costoEnvio = iFlete>-1 ? parseNum(row[iFlete]) : '';

    const existing = STATE.pedidos.find(p=> normCliente(p.cliente)===normCliente(clienteRaw) && p.fecha===fecha);
    if(existing){
      existing.estado = estado; existing.transportadora = transportadora; existing.producto = producto;
      existing.precioVenta = precioVenta; existing.costoProducto = costoProducto; existing.costoEnvio = costoEnvio;
      existing.ciudad = ciudad; existing.provincia = provincia; existing.cantidad = cantidad;
      actualizados++;
    } else {
      STATE.pedidos.push({
        id: uid(), fecha, cliente: clienteRaw, telefono:'', provincia, ciudad,
        producto, cantidad, precioVenta, costoProducto, costoEnvio,
        transportadora, guia:'', estado, email:'', direccion:''
      });
      nuevos++;
    }
  }

  const minF = fechas.length ? fechas.reduce((a,b)=>a<b?a:b) : null;
  const maxF = fechas.length ? fechas.reduce((a,b)=>a>b?a:b) : null;
  const noEncontrados = STATE.pedidos.filter(p=>{
    if(!p.fecha || !p.cliente) return false;
    if(minF && (p.fecha<minF || p.fecha>maxF)) return false;
    const key = normCliente(p.cliente)+'|'+p.fecha;
    return !seenKeys.has(key);
  });

  await saveList(KEYS.pedidos, STATE.pedidos);
  return { actualizados, nuevos, noEncontrados };
}

let pedidoTab = 'todos';
function pedidosForTab(tab){
  switch(tab){
    case 'confirmado': return STATE.pedidos.filter(p=>p.estado==='Confirmado');
    case 'guia_generada': return STATE.pedidos.filter(p=>p.guia && !['Entregado','Devuelto','Cancelado'].includes(p.estado));
    case 'entregado': return STATE.pedidos.filter(p=>p.estado==='Entregado');
    case 'guia_enviada': return STATE.pedidos.filter(p=>p.seguimientoEnviado);
    default: return STATE.pedidos;
  }
}

  const importStatus = document.createElement('div'); importStatus.className='note';

  async function processImportedRows(rows){
    if(!rows || rows.length < 2){ importStatus.textContent = 'El archivo no tiene filas de datos.'; importStatus.style.color='var(--red)'; return; }
    let headerIdx = 0;
    for(let i=0;i<Math.min(rows.length,5);i++){

    }
    const headerRow = (rows[headerIdx]||[]).map(h=>normStr(h));
    const idx = (name)=>headerRow.findIndex(h=>h.includes(name));
    const isAnuncios = headerRow.some(h=>h.includes('fecha anuncio')) || headerRow.some(h=>h.includes('nombre cliente'));
    let added = 0, autocompletados = 0;

    if(isAnuncios){
      const iFecha=idx('fecha anuncio'), iNombre=idx('nombre cliente'), iTel=idx('telefono'),
        iCiudad=idx('ciudad'), iProd=idx('producto'), iOrigen=idx('origen'), iEstado=idx('estado de entrega');
      for(let r=headerIdx+1; r<rows.length; r++){
        const row = rows[r]; if(!row) continue;
        const nombre = iNombre>-1 ? String(row[iNombre]||'').trim() : '';
        if(!nombre) continue; // fila de ejemplo o vacía
        const rawCiudad = iCiudad>-1 ? row[iCiudad] : '';
        const {provincia, ciudad} = findProvinciaCiudad(rawCiudad);
        const rawProducto = iProd>-1 ? String(row[iProd]||'').trim() : '';
        let catalogo = rawProducto ? findProducto(rawProducto) : null;
        if(!catalogo && rawProducto){
          catalogo = STATE.productos.find(p=>{
            const a = normStr(p.nombre), b = normStr(rawProducto);
            return a===b || b.includes(a) || a.includes(b);
          });
        }
        if(catalogo) autocompletados++;
        const estadoRaw = iEstado>-1 ? String(row[iEstado]||'').trim() : '';
        const estado = estadoRaw==='Cancelado' ? 'Cancelado' : 'Pendiente';
        const pricing = catalogo ? scaledPricing(catalogo, 1) : {precioVenta:'', costoProducto:''};
        const transportadoraGuess = '';
        const envioMatch = findEnvioCosto(ciudad, transportadoraGuess, pricing.precioVenta);
        const costoEnvioFinal = envioMatch ? envioMatch.costo : '';
        STATE.pedidos.push({
          id: uid(),
          fecha: iFecha>-1 ? parseAnyDate(row[iFecha]) : '',
          cliente: nombre,
          telefono: iTel>-1 ? normalizePhoneRaw(row[iTel]) : '',
          provincia, ciudad,
          producto: catalogo ? catalogo.nombre : rawProducto,
          cantidad: 1,
          precioVenta: pricing.precioVenta,
          costoProducto: pricing.costoProducto,
          costoEnvio: costoEnvioFinal, transportadora: transportadoraGuess, guia: '', estado,
          origen: iOrigen>-1 ? String(row[iOrigen]||'').trim() : '',
          email:'', direccion:''
        });
        added++;
      }
    } else {
      const iTracking=idx('track')>-1?idx('track'):idx('guia'),
        iEstado=idx('estado'), iTrans=idx('transport'),
        iEnvio=idx('env'), iProd=idx('product'), iUd=idx('ud'), iPrecio=idx('precio'),
        iNombre=idx('nombre'), iDir=idx('direcc'), iCiudad=idx('ciudad'),
        iTel=idx('tel'), iEmail=idx('email'), iFecha=idx('fecha');
      for(let r=headerIdx+1; r<rows.length; r++){
        const row = rows[r];
        if(!row || row.every(c=>c===undefined || c===null || String(c).trim()==='')) continue;
        const val = (i)=> i>-1 && row[i]!==undefined && row[i]!==null ? String(row[i]).trim() : '';
        const rawCiudad = iCiudad>-1 ? row[iCiudad] : '';
        const {provincia, ciudad} = findProvinciaCiudad(rawCiudad);

          const envioMatch = findEnvioCosto(ciudad, transportadora, precioVenta);

          id: uid(),
          fecha: iFecha>-1 ? parseAnyDate(row[iFecha]) : '',
          cliente: val(iNombre),
          telefono: iTel>-1 ? normalizePhoneRaw(row[iTel]) : '',
          provincia, ciudad,
          producto: val(iProd),
          cantidad: val(iUd) || 1,
          precioVenta,

          guia: val(iTracking),

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const sep = text.indexOf(';') > -1 && text.indexOf(',') === -1 ? ';' : ',';
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === sep){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r[0]&&r[0].trim()));
}

/* ================= PRODUCTOS ================= */
function findProducto(nombre){ return STATE.productos.find(p=>p.nombre===nombre); }
function scaledPricing(catalogo, cantidad){
  const qty = Math.max(1, parseNum(cantidad) || 1);
  return {
    precioVenta: (parseNum(catalogo.precioVenta)*qty).toFixed(2),
    costoProducto: (parseNum(catalogo.costoProducto)*qty).toFixed(2)
  };
}
function findEnvioCosto(ciudad, transportadora, valor){
  if(!ciudad) return null;
  const v = parseNum(valor);
  let m;
  if(transportadora && v) m = STATE.envios.find(e=>e.ciudad===ciudad && e.transportadora===transportadora && Number(e.valor)===v);
  if(!m && v) m = STATE.envios.find(e=>e.ciudad===ciudad && Number(e.valor)===v);
  if(!m && transportadora) m = STATE.envios.find(e=>e.ciudad===ciudad && e.transportadora===transportadora);
  if(!m) m = STATE.envios.find(e=>e.ciudad===ciudad);
  return m || null;
}
function upsertEnvioLocal(ciudad, transportadora, valor, costo){
  if(!ciudad || !transportadora || !(parseNum(costo)>0)) return false;
  const v = parseNum(valor)||0;
  let e = STATE.envios.find(x=>x.ciudad===ciudad && x.transportadora===transportadora && Number(x.valor)===v);
  if(e){ if(Number(e.costo)===parseNum(costo)) return false; e.costo = parseNum(costo); }
  else { STATE.envios.push({id:uid(), ciudad, transportadora, valor:v, costo:parseNum(costo)}); }
  return true;
}
async function upsertEnvio(ciudad, transportadora, valor, costo){
  const changed = upsertEnvioLocal(ciudad, transportadora, valor, costo);
  if(changed) await saveList(KEYS.envios, STATE.envios);
}

/* ================= REPORTES ================= */
let reportState = { desde:'', hasta:'', tipo:'productos' };
function ensureReportRango(){
  if(reportState.desde && reportState.hasta) return;
  const hoy = new Date();
  reportState.hasta = hoy.toISOString().slice(0,10);
  const d = new Date(hoy); d.setDate(d.getDate()-90);
  reportState.desde = d.toISOString().slice(0,10);
}
function buildReporteProductos(pedidos){
  const nombres = [...new Set(pedidos.map(p=>p.producto).filter(Boolean))];
  return nombres.map(nombre=>{
    const ped = pedidos.filter(p=>p.producto===nombre);
    const entregados = ped.filter(p=>p.estado==='Entregado');
    const vendidos = ped.reduce((s,p)=>s+parseNum(p.cantidad),0);
    const facturacion = ped.reduce((s,p)=>s+parseNum(p.precioVenta),0);
    const facturacionEntregada = entregados.reduce((s,p)=>s+parseNum(p.precioVenta),0);
    const costoTotal = entregados.reduce((s,p)=>s+parseNum(p.costoProducto)+parseNum(p.costoEnvio),0);
    return { 'Producto':nombre, 'Pedidos':ped.length, 'Unidades':vendidos, 'Entregados':entregados.length,
      'Facturación total':facturacion, 'Facturación entregada':facturacionEntregada,
      'Ganancia estimada':facturacionEntregada-costoTotal, 'Ticket promedio': ped.length? facturacion/ped.length : 0 };
  }).sort((a,b)=>b['Facturación total']-a['Facturación total']);
}
function buildReporteTransportadoras(pedidos){
  const usadas = [...new Set(pedidos.map(p=>p.transportadora).filter(Boolean))];
  return usadas.map(t=>{
    const ped = pedidos.filter(p=>p.transportadora===t);
    const entregados = ped.filter(p=>p.estado==='Entregado').length;
    const devueltos = ped.filter(p=>p.estado==='Devuelto').length;
    const facturacionEntregada = ped.filter(p=>p.estado==='Entregado').reduce((s,p)=>s+parseNum(p.precioVenta),0);
    const costoEnvioTotal = ped.reduce((s,p)=>s+parseNum(p.costoEnvio),0);
    return { 'Transportadora':t, 'Pedidos':ped.length, 'Entregados':entregados, 'Devueltos':devueltos,
      '% Entrega': ped.length? (entregados/ped.length*100) : 0, 'Facturación entregada':facturacionEntregada,
      'Costo envío total':costoEnvioTotal };
  }).sort((a,b)=>b.Pedidos-a.Pedidos);
}
function buildReporteCiudades(pedidos){
  const ciudades = [...new Set(pedidos.map(p=>p.ciudad).filter(Boolean))];
  return ciudades.map(c=>{
    const ped = pedidos.filter(p=>p.ciudad===c);
    const entregados = ped.filter(p=>p.estado==='Entregado').length;
    const facturacion = ped.reduce((s,p)=>s+parseNum(p.precioVenta),0);
    const conEnvio = ped.filter(p=>parseNum(p.costoEnvio)>0);
    const costoEnvioProm = conEnvio.length ? conEnvio.reduce((s,p)=>s+parseNum(p.costoEnvio),0)/conEnvio.length : 0;
    return { 'Ciudad':c, 'Provincia': ped.find(p=>p.provincia)?.provincia||'', 'Pedidos':ped.length,
      'Entregados':entregados, 'Facturación':facturacion, 'Costo envío promedio':costoEnvioProm };
  }).sort((a,b)=>b.Pedidos-a.Pedidos);
}
function buildReporteClientes(pedidos){
  const nombres = [...new Set(pedidos.map(p=>p.cliente).filter(Boolean))];
  return nombres.map(nombre=>{
    const ped = pedidos.filter(p=>p.cliente===nombre);
    const entregados = ped.filter(p=>p.estado==='Entregado').length;
    const facturacion = ped.reduce((s,p)=>s+parseNum(p.precioVenta),0);
    return { 'Cliente':nombre, 'Teléfono': ped.find(p=>p.telefono)?.telefono||'', 'Pedidos':ped.length,
      'Entregados':entregados, 'Facturación':facturacion };
  }).sort((a,b)=>b.Pedidos-a.Pedidos).slice(0,80);
}
function buildReporteFinanciero(pedidos, egresos){
  const m = computeMetrics(pedidos, STATE.compras, egresos);
  return [
    {Rubro:'Facturación total', Valor: m.facturacionTotal, Tipo:'dinero'},
    {Rubro:'Facturación entregada', Valor: m.facturacionEntregada, Tipo:'dinero'},
    {Rubro:'Facturación en tránsito', Valor: m.facturacionTransito, Tipo:'dinero'},
    {Rubro:'Facturación en novedad', Valor: m.facturacionNovedad, Tipo:'dinero'},
    {Rubro:'Costo de producto (entregados)', Valor: -m.costoProductoEntregado, Tipo:'dinero'},
    {Rubro:'Costo de envío (entregados)', Valor: -m.costoEnvioEntregado, Tipo:'dinero'},
    {Rubro:'Gasto en campañas (ads)', Valor: -m.gastoAds, Tipo:'dinero'},
    {Rubro:'Otros gastos', Valor: -m.gastoOtros, Tipo:'dinero'},
    {Rubro:'Utilidad neta', Valor: m.utilidadNeta, Tipo:'dinero'},
    {Rubro:'% Confirmación', Valor: m.pctConfirmacion, Tipo:'pct'},
    {Rubro:'% Entrega', Valor: m.pctEntrega, Tipo:'pct'},
    {Rubro:'Ticket promedio', Valor: m.ticketMedio, Tipo:'dinero'},
  ];
}
const REPORTES_DEF = [
  ['productos','Por producto', buildReporteProductos],
  ['transportadoras','Por transportadora', buildReporteTransportadoras],
  ['ciudades','Por ciudad', buildReporteCiudades],
  ['clientes','Top clientes', buildReporteClientes],
  ['financiero','Financiero resumen', buildReporteFinanciero],
];
function xlsxAvailable(){ return typeof XLSX !== 'undefined'; }
function exportReporte(nombre, data){
  if(!xlsxAvailable()){ alert('No se pudo cargar el generador de Excel (revisa tu conexión) e inténtalo de nuevo.'); return; }
  const clean = data.map(row=>{ const r={...row}; delete r.Tipo; return r; });
  const ws = XLSX.utils.json_to_sheet(clean.length? clean : [{Info:'Sin datos en este período'}]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, nombre.slice(0,30));
  XLSX.writeFile(wb, `Ventura - ${nombre} - ${reportState.desde}_a_${reportState.hasta}.xlsx`);
}
function exportTodosReportes(pedidos){
  if(!xlsxAvailable()){ alert('No se pudo cargar el generador de Excel (revisa tu conexión) e inténtalo de nuevo.'); return; }
  const wb = XLSX.utils.book_new();
  REPORTES_DEF.forEach(([id,label,fn])=>{
    const data = fn(pedidos, STATE.egresos).map(row=>{ const r={...row}; delete r.Tipo; return r; });
    const ws = XLSX.utils.json_to_sheet(data.length? data : [{Info:'Sin datos en este período'}]);
    XLSX.utils.book_append_sheet(wb, ws, label.slice(0,30));
  });
  XLSX.writeFile(wb, `Ventura - Reportes completos - ${reportState.desde}_a_${reportState.hasta}.xlsx`);
}

/* ================= CALCULADORA DE RENTABILIDAD ================= */
let calc = { precioVenta:25, costoProducto:8, costoEnvio:4, pctConfirmacion:70, pctEntrega:80, inversion:100 };

function renderCalculadora(){
  const main = document.getElementById('main');
  main.appendChild(head('Calculadora de rentabilidad', 'Simula cuánto puedes invertir en ads sin perder plata, dado tu costo y tus tasas de confirmación/entrega.'));

  const panel = document.createElement('div'); panel.className='panel';
  const grid = document.createElement('div'); grid.className='form-grid';
  grid.innerHTML = `
    <div class="field"><label>Precio de venta</label><input id="k_precio" type="number" step="0.01" value="${calc.precioVenta}"></div>
    <div class="field"><label>Costo de producto</label><input id="k_costoP" type="number" step="0.01" value="${calc.costoProducto}"></div>
    <div class="field"><label>Costo de envío</label><input id="k_costoE" type="number" step="0.01" value="${calc.costoEnvio}"></div>
    <div class="field"><label>Inversión publicitaria</label><input id="k_inv" type="number" step="1" value="${calc.inversion}"></div>
  `;
  panel.appendChild(grid);

  const sliders = document.createElement('div'); sliders.style.marginTop='10px';
  sliders.innerHTML = `
    <label>% Confirmación — pedidos creados que terminan confirmados: <b id="k_confL">${calc.pctConfirmacion}%</b></label>
    <input id="k_conf" type="range" min="0" max="100" value="${calc.pctConfirmacion}">
    <label style="margin-top:10px">% Entrega — confirmados que llegan al cliente: <b id="k_entL">${calc.pctEntrega}%</b></label>
    <input id="k_ent" type="range" min="0" max="100" value="${calc.pctEntrega}">
  `;
  panel.appendChild(sliders);
  main.appendChild(panel);

  const resultPanel = document.createElement('div'); resultPanel.className='panel';
  resultPanel.innerHTML = `<h2>Resultado de la simulación</h2>`;
  const resBody = document.createElement('div');
  resultPanel.appendChild(resBody);
  main.appendChild(resultPanel);

  function recalc(){
    calc.precioVenta = parseNum(document.getElementById('k_precio').value);
    calc.costoProducto = parseNum(document.getElementById('k_costoP').value);
    calc.costoEnvio = parseNum(document.getElementById('k_costoE').value);
    calc.inversion = parseNum(document.getElementById('k_inv').value);
    calc.pctConfirmacion = parseNum(document.getElementById('k_conf').value);
    calc.pctEntrega = parseNum(document.getElementById('k_ent').value);
    document.getElementById('k_confL').textContent = calc.pctConfirmacion + '%';
    document.getElementById('k_entL').textContent = calc.pctEntrega + '%';

    // Cuántos pedidos entrantes puede pagar esa inversión (asumiendo CPA implícito por pedido entrante = inversión / pedidos entrantes)
    // Para un CPA dado, pedidos entrantes = inversion / CPA. Aquí resolvemos el CPA máximo que deja profit >= 0.
    const margenPorEntregado = calc.precioVenta - calc.costoProducto - calc.costoEnvio;
    const tasaEntregaEfectiva = (calc.pctConfirmacion/100) * (calc.pctEntrega/100);
    const cpaMaximo = margenPorEntregado * tasaEntregaEfectiva; // costo por pedido entrante que deja profit = 0
    const roasMinimo = tasaEntregaEfectiva > 0 ? (calc.precioVenta / (cpaMaximo || 1)) : 0;

    // Con la inversión dada, estimamos pedidos entrantes si gastamos toda la inversión al CPA máximo (punto de equilibrio)
    const pedidosEntrantesEquilibrio = cpaMaximo>0 ? calc.inversion / cpaMaximo : 0;

    // Profit bruto con la inversión dada, asumiendo que se traduce en 1 pedido entrante por cada $CPA (usamos CPA máximo como referencia de costo real por pedido)
    // Mostramos escenario simple: ingresos - costos - inversión, para el número de pedidos entrantes de equilibrio
    const entregadosEquilibrio = pedidosEntrantesEquilibrio * tasaEntregaEfectiva;
    const ingresos = entregadosEquilibrio * calc.precioVenta;
    const costoProdTotal = entregadosEquilibrio * calc.costoProducto;
    const costoEnvioTotal = entregadosEquilibrio * calc.costoEnvio;
    const profitBruto = ingresos - costoProdTotal - costoEnvioTotal - calc.inversion;

    resBody.innerHTML = `
      <table><tbody>
        <tr><td>Margen por pedido entregado (antes de ads)</td><td style="text-align:right; font-weight:600">${money(margenPorEntregado)}</td></tr>
        <tr><td>Tasa de entrega efectiva (confirmación × entrega)</td><td style="text-align:right; font-weight:600">${pct(tasaEntregaEfectiva*100)}</td></tr>
        <tr><td><b>CPA máximo</b> — lo máximo que puedes pagar por pedido entrante sin perder plata</td><td style="text-align:right; font-weight:700; color:var(--gold)">${money(cpaMaximo)}</td></tr>
        <tr><td><b>ROAS mínimo</b> — retorno mínimo sobre lo invertido en ads</td><td style="text-align:right; font-weight:700; color:var(--gold)">${(roasMinimo||0).toFixed(2)}x</td></tr>
        <tr><td>Pedidos entrantes en punto de equilibrio con tu inversión</td><td style="text-align:right; font-weight:600">${pedidosEntrantesEquilibrio.toFixed(1)}</td></tr>
        <tr><td style="font-weight:700">Profit bruto estimado (si el CPA real = CPA máximo)</td><td style="text-align:right; font-weight:700; color:${profitBruto>=0?'var(--green)':'var(--red)'}">${money(profitBruto)}</td></tr>
      </tbody></table>
      <p class="note">Este profit da ~$0 a propósito: el CPA máximo es, por definición, el punto de equilibrio. Si tu CPA real (lo que de verdad pagas por pedido en Meta/TikTok) es menor al CPA máximo mostrado arriba, estás ganando; si es mayor, estás perdiendo.</p>
    `;
  }
  ['k_precio','k_costoP','k_costoE','k_inv','k_conf','k_ent'].forEach(id=>{
    document.getElementById(id).addEventListener('input', recalc);
  });
  recalc();
}
